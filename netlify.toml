# Netlify deployment for the Apple-04 web build.
# Build command runs from the repo root so npm workspaces resolve correctly.
#
# These settings apply when the site is connected to the repository in the
# Netlify dashboard (the supported way to get automatic deploys on push).
# To deploy a prebuilt web/dist from the CLI instead, copy only the [[headers]]
# blocks below into a scratch directory alongside the built files and run
# `netlify deploy --prod --dir=dist --site=<site-id>` from there. Leaving the
# [build] section in scope makes the CLI invoke `npm run build`, which cannot
# succeed outside the full repository.

[build]
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# Vite emits hashed, immutable asset filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
